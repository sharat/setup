ck: 'pr checks --watch'
clone: 'repo clone'
co: 'pr checkout'
fork: 'repo fork --clone'
ic: 'issue create'
is: 'issue list --assignee @me'
mg: 'pr merge --squash --delete-branch'
mine: 'repo list --limit 50'
new: 'repo create --private --source=. --push'
open: 'browse'
prc: 'pr create --fill'
prd: 'pr create --fill --draft'
prs: 'pr status'
prv: 'pr view --web'
runs: 'run list --limit 10'
rw: 'run watch'
